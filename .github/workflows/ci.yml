# Integração contínua do mixtape-lib-v1: auditoria das dependências, tipos, testes, traduções,
# ícones, contraste da paleta, o pacote e o Storybook, em pull request e em push na main. A entrega é o
# publish.yml, que publica no GitHub Packages quando chega uma tag v*.
#
# O pipeline também é superfície de ataque: as actions vão fixadas por commit (tag pode ser movida),
# o token só lê, e o checkout não deixa credencial no disco para os passos seguintes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Auditoria, tipos, testes, paleta e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        run: npm ci

      # O que vai para o front não passa com aviso nenhum; o resto, sem alto.
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditar todas as dependências
        run: npm audit --audit-level=high

      - run: npm run type-check
      - run: npm test
      - run: npm run check:locales

      # Ícone fora do subconjunto gerado some da tela sem erro.
      - run: npm run check:icons

      # Componente ou parte interativa sem data-testid deixa os testes de interface do front sem alvo.
      - run: npm run check:testids

      # A paleta é contrato: versão que quebra contraste não sai.
      - run: npm run check:contrast

      - run: npm run build

      # Story quebrada é documentação mentindo.
      - run: npm run build-storybook

      # O que o pacote leva: só `dist`.
      - name: Conferir o conteúdo do pacote
        run: npm pack --dry-run
