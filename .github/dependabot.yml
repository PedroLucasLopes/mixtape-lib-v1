# Atualizações automáticas, uma vez por semana, em pull request. As actions são fixadas por commit:
# sem isto, a versão fixada envelheceria calada, sem as correções de segurança.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # O TypeScript 7 (compilador nativo) não exporta `typescript/lib/tsc`, de que o vue-tsc 3
      # precisa: o major do TypeScript sobe junto com um vue-tsc que o suporte, à mão.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Os tipos do Node acompanham o Node do CI e das imagens (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
